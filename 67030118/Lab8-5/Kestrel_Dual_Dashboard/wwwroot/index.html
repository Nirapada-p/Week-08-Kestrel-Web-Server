<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual-Channel IoT Dashboard</title>
    <style>
        :root {
            --bg: #0a0f1d;
            --card: rgba(16, 24, 40, 0.75);
            --border: rgba(56, 189, 248, 0.2);
            --cyan: #00f2fe;
            --green: #00ffcc;
        }
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 50% 15%, #132238 0%, var(--bg) 100%);
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 900px;
        }
        .widget-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .needle { transition: transform 0.12s cubic-bezier(0.1, 0.8, 0.3, 1); transform-origin: 100px 100px; }
        .led { transition: opacity 0.1s ease, filter 0.1s ease; }
        .seg { fill: #1e293b; opacity: 0.15; transition: opacity 0.08s ease, fill 0.08s ease; }
        .seg.active { fill: var(--green); opacity: 1; filter: drop-shadow(0 0 6px var(--green)); }
        #water-fill { transition: y 0.15s ease-out, height 0.15s ease-out; }

        .sevenseg-panel {
            background: #05070c;
            border-radius: 10px;
            padding: 10px 16px;
            border: 1px solid rgba(0,255,204,0.15);
        }

        .source-badge {
            display: inline-block;
            margin-top: 20px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            background: rgba(0, 242, 254, 0.1);
            color: var(--cyan);
            border: 1px solid rgba(0, 242, 254, 0.3);
        }
    </style>
</head>
<body>
    <h1>🎛️ Dual-Channel IoT Command Center</h1>
    <p style="color: #94a3b8; margin-bottom: 20px;">ESP32 Hardware Stream &bull; Kestrel Edge Web Server</p>
    
    <div style="background: rgba(0,255,204,0.08); border: 1px solid rgba(0,255,204,0.3); border-radius: 12px; padding: 10px 18px; margin-bottom: 20px; text-align: center; font-size: 0.9rem;">
    🎓 รหัสนักศึกษา 3 ตัวท้าย: <b style="color:#00ffcc;">118</b>
</div>

    <div class="dashboard-grid">
        <!-- ============ เกจ์ซ้าย (CH-A) : Retro 7-Segment (หมายเลข 3) ============ -->
        <div class="widget-card" id="card-left">
            <h3 id="title-left">CH-A: Retro 7-Segment</h3>
            <div id="container-left" class="sevenseg-panel">
                <svg width="150" height="90" viewBox="0 0 100 70">
                    <g id="digit1">
                        <rect id="d1-a" class="seg" x="9"  y="2"  width="26" height="6"/>
                        <rect id="d1-b" class="seg" x="33" y="6"  width="6" height="26"/>
                        <rect id="d1-c" class="seg" x="33" y="36" width="6" height="26"/>
                        <rect id="d1-d" class="seg" x="9"  y="62" width="26" height="6"/>
                        <rect id="d1-e" class="seg" x="5"  y="36" width="6" height="26"/>
                        <rect id="d1-f" class="seg" x="5"  y="6"  width="6" height="26"/>
                        <rect id="d1-g" class="seg" x="9"  y="32" width="26" height="6"/>
                    </g>
                    <g id="digit2" transform="translate(48,0)">
                        <rect id="d2-a" class="seg" x="9"  y="2"  width="26" height="6"/>
                        <rect id="d2-b" class="seg" x="33" y="6"  width="6" height="26"/>
                        <rect id="d2-c" class="seg" x="33" y="36" width="6" height="26"/>
                        <rect id="d2-d" class="seg" x="9"  y="62" width="26" height="6"/>
                        <rect id="d2-e" class="seg" x="5"  y="36" width="6" height="26"/>
                        <rect id="d2-f" class="seg" x="5"  y="6"  width="6" height="26"/>
                        <rect id="d2-g" class="seg" x="9"  y="32" width="26" height="6"/>
                    </g>
                    <text x="88" y="66" fill="var(--green)" font-size="14" font-weight="bold">%</text>
                </svg>
            </div>
            <p id="val-left" style="font-size: 1.5rem; font-weight: bold; color: var(--cyan); margin-top: 10px;">0.0%</p>
        </div>

        <!-- ============ เกจ์ขวา (CH-B) : Audio VU Meter (หมายเลข 2) ============ -->
        <div class="widget-card" id="card-right">
            <h3 id="title-right">CH-B: Audio VU Meter</h3>
            <div id="container-right">
                <svg width="250" height="40" viewBox="0 0 250 40" id="vumeter-right">
                    <rect class="led vu" x="5"   y="5" width="18" height="30" rx="3" fill="#22c55e" opacity="0.15"/>
                    <rect class="led vu" x="28"  y="5" width="18" height="30" rx="3" fill="#22c55e" opacity="0.15"/>
                    <rect class="led vu" x="51"  y="5" width="18" height="30" rx="3" fill="#22c55e" opacity="0.15"/>
                    <rect class="led vu" x="74"  y="5" width="18" height="30" rx="3" fill="#22c55e" opacity="0.15"/>
                    <rect class="led vu" x="97"  y="5" width="18" height="30" rx="3" fill="#22c55e" opacity="0.15"/>
                    <rect class="led vu" x="120" y="5" width="18" height="30" rx="3" fill="#22c55e" opacity="0.15"/>
                    <rect class="led vu" x="143" y="5" width="18" height="30" rx="3" fill="#eab308" opacity="0.15"/>
                    <rect class="led vu" x="166" y="5" width="18" height="30" rx="3" fill="#eab308" opacity="0.15"/>
                    <rect class="led vu" x="189" y="5" width="18" height="30" rx="3" fill="#ef4444" opacity="0.15"/>
                    <rect class="led vu" x="212" y="5" width="18" height="30" rx="3" fill="#ef4444" opacity="0.15"/>
                </svg>
            </div>
            <p id="val-right" style="font-size: 1.5rem; font-weight: bold; color: var(--cyan); margin-top: 10px;">0.0%</p>
        </div>
    </div>

    <div class="source-badge" id="disp-source">Connecting to Server...</div>

    <script>
        // ============================================================
        // 1. โมดูล Retro 7-Segment (เกจ์ซ้าย / CH-A)
        // ============================================================
        const SEGMENT_MAP = {
            0: ['a','b','c','d','e','f'],
            1: ['b','c'],
            2: ['a','b','g','e','d'],
            3: ['a','b','g','c','d'],
            4: ['f','g','b','c'],
            5: ['a','f','g','c','d'],
            6: ['a','f','g','e','c','d'],
            7: ['a','b','c'],
            8: ['a','b','c','d','e','f','g'],
            9: ['a','b','c','d','f','g']
        };

        function setDigit(prefix, val) {
            const segs = ['a','b','c','d','e','f','g'];
            segs.forEach(s => {
                const el = document.getElementById(`${prefix}-${s}`);
                if (!el) return;
                if (SEGMENT_MAP[val].includes(s)) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        function updateLeftWidget(percentage) {
            let val = Math.round(percentage);
            if (val > 99) val = 99;
            if (val < 0) val = 0;
            const tens = Math.floor(val / 10);
            const units = val % 10;
            setDigit('d1', tens);
            setDigit('d2', units);
        }

        // ============================================================
        // 2. โมดูล Audio VU Meter (เกจ์ขวา / CH-B)
        // ============================================================
        function updateRightWidget(percentage) {
            const leds = document.querySelectorAll('#vumeter-right .led');
            const totalLeds = leds.length;
            const activeCount = Math.round((percentage / 100.0) * totalLeds);

            leds.forEach((led, index) => {
                if (index < activeCount) {
                    led.style.opacity = '1.0';
                    const color = led.getAttribute('fill');
                    led.style.filter = `drop-shadow(0 0 6px ${color})`;
                } else {
                    led.style.opacity = '0.15';
                    led.style.filter = 'none';
                }
            });
        }

        // ============================================================
        // 3. Polling Loop หลัก
        // ============================================================
        async function pollTelemetry() {
            try {
                const res = await fetch('/api/telemetry');
                if (!res.ok) return;
                const data = await res.json();

                updateLeftWidget(data.channelA.percentage);
                document.getElementById('val-left').textContent = data.channelA.percentage.toFixed(1) + '%';

                updateRightWidget(data.channelB.percentage);
                document.getElementById('val-right').textContent = data.channelB.percentage.toFixed(1) + '%';

                document.getElementById('disp-source').textContent = '📡 ' + data.dataSource;

            } catch (err) {
                console.error(err);
            }
        }
        setInterval(pollTelemetry, 150);
    </script>
</body>
</html>
